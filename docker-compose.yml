services:
  # Local Redis, standing in for the same Redis instance that fronts prod/staging
  # on Coolify -- the worker's Celery client code is identical either way, only
  # REDIS_URL differs.
  redis:
    image: redis:7-alpine
    profiles: ["dev"]
    ports:
      - "6379:6379"
    networks:
      default:
      devbutter_shared:
        aliases:
          - redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: selolibertaria-mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MAILPIT_SMTP_LISTEN_ADDR: 0.0.0.0:1025
      MAILPIT_WEB_LISTEN_ADDR: 0.0.0.0:8025

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      default:
      devbutter_shared:
        aliases:
          - relay-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app
        - path: ./alembic
          action: sync+restart
          target: /app/alembic

  worker:
    build: .
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    networks:
      default:
      devbutter_shared:
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app

networks:
  default:
  devbutter_shared:
    external: true

volumes:
  mailpit_data:
