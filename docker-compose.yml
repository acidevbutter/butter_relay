services:
  # Redis is not defined here -- it's global in infra/docker-compose.yml,
  # aliased as `redis` on the shared `devbutter_shared` network for every
  # app's worker to share. Bring it up first:
  # `docker compose -f ../infra/docker-compose.yml up -d redis`.
  mailpit:
    image: axllent/mailpit:latest
    container_name: selolibertaria-mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MAILPIT_SMTP_LISTEN_ADDR: 0.0.0.0:1025
      MAILPIT_WEB_LISTEN_ADDR: 0.0.0.0:8025

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      default:
      devbutter_shared:
        aliases:
          - relay-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app
        - path: ./alembic
          action: sync+restart
          target: /app/alembic

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    networks:
      default:
      devbutter_shared:
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app

networks:
  default:
  devbutter_shared:
    external: true

volumes:
  mailpit_data:
