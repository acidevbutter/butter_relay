services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5433:5432"
    volumes:
      - relay_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SQS-API-compatible queue for local dev, so the worker's boto3 client code
  # is identical here and on real AWS SQS -- only SQS_ENDPOINT_URL differs.
  elasticmq:
    image: softwaremill/elasticmq-native:1.5.7
    profiles: ["dev"]
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@db:5432/relay
      SQS_ENDPOINT_URL: http://elasticmq:9324
      # ElasticMQ doesn't check these, but boto3 refuses to sign a request with
      # no credentials at all. On real AWS, the ECS task's IAM role supplies
      # credentials automatically and these are never set/needed.
      AWS_ACCESS_KEY_ID: local-dev
      AWS_SECRET_ACCESS_KEY: local-dev
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      devbutter_shared:
        aliases:
          - relay-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app
        - path: ./alembic
          action: sync+restart
          target: /app/alembic

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@db:5432/relay
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local-dev
      AWS_SECRET_ACCESS_KEY: local-dev
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      devbutter_shared:
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app

volumes:
  relay_db_data:

networks:
  default:
  devbutter_shared:
    external: true
