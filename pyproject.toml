[tool.poetry]
name = "butter-relay"
version = "0.1.0"
description = "DevButter company-wide email dispatch service: SQS-driven, template-based transactional email with an admin dashboard."
authors = ["DevButter <hello@devbutter.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
greenlet = "^3.1.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
boto3 = "^1.35.0"
jinja2 = "^3.1.4"
httpx = "^0.27.0"
bcrypt = "^4.2.0"
itsdangerous = "^2.2.0"
jsonschema = "^4.23.0"
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
aiosqlite = "^0.20.0"
moto = { extras = ["sqs"], version = "^5.0.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
